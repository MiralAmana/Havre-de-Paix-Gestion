name: Publier une version

# Se déclenche quand on pousse un tag de version (ex. v1.0.1, créé par "npm version").
# Construit l'installeur Windows et le publie dans les Releases GitHub,
# d'où les applications installées récupèrent la mise à jour.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder envoie ses fichiers en parallèle : si la Release n'existe pas encore,
      # il en crée deux (constaté sur v1.0.0). On la crée d'abord ; il la réutilise.
      - name: Créer la Release
        shell: bash
        run: >
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "Version ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'installeur
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
