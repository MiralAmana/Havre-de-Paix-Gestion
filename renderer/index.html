<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Havre de Paix - Gestion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <img src="assets/logo.svg" alt="Logo ADRI" />
        </div>
        <h1>Havre de Paix<small>Gestion</small></h1>
      </div>

      <button class="nav-btn" data-screen="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        Tableau de bord
      </button>
      <button class="nav-btn" data-screen="stock">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8l-9-5-9 5 9 5 9-5z" />
          <path d="M3 8v8l9 5 9-5V8" />
          <path d="M12 13v8" />
        </svg>
        Stock
      </button>
      <button class="nav-btn" data-screen="produits">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.59 2H4a2 2 0 0 0-2 2v8.59a2 2 0 0 0 .59 1.41l9.83 9.83a2 2 0 0 0 2.83 0l7.17-7.17a2 2 0 0 0 0-2.83L12.99 2.59A2 2 0 0 0 12.59 2z" />
          <circle cx="7" cy="7" r="1.3" fill="currentColor" stroke="none" />
        </svg>
        Produits
      </button>
      <button class="nav-btn" data-screen="depenses">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12v18l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V3z" />
          <path d="M9 8h6M9 12h6M9 16h4" />
        </svg>
        Dépenses
      </button>
      <button class="nav-btn" data-screen="dettes">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Dettes clients
      </button>

      <div style="flex: 1"></div>
      <div class="nav-divider"></div>
      <button class="nav-btn" id="backup-now-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <path d="M17 21v-8H7v8" />
          <path d="M7 3v5h8" />
        </svg>
        Sauvegarder maintenant
      </button>
      <button class="nav-btn" id="import-excel-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="M17 8l-5-5-5 5" />
          <path d="M12 3v12" />
        </svg>
        Importer depuis Excel
      </button>
    </aside>
    <main class="content">
      <div class="content-header">
        <h2 id="page-title">Tableau de bord</h2>
        <div id="page-actions"></div>
      </div>
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <script src="assets/vendor/chart.umd.js"></script>
  <script src="utils.js"></script>
  <script src="screens/dashboard.js"></script>
  <script src="screens/produits.js"></script>
  <script src="screens/stock.js"></script>
  <script src="screens/depenses.js"></script>
  <script src="screens/dettes.js"></script>
  <script src="app.js"></script>
</body>
</html>
